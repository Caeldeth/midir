appId: co.eris.midir
productName: Midir
# The Windows master, 1024x1024 with real alpha: the Red Hyb variant Midir
# claims (the document repo's docs/logos). The runtime assets are cut from it;
# see the recipes beside each use. build/ is buildResources and never packaged.
icon: build/icon.png
directories:
  buildResources: build
# Turn off escape hatches built into the Electron binary that the app never uses
# (HTOO-374). The one that matters is runAsNode: without it,
#   ELECTRON_RUN_AS_NODE=1 midir.exe -e "<script>"
# turns the shipped binary into a general-purpose Node interpreter. Midir has
# Npcap open and posts input to another process's window, so that interpreter
# would inherit a real capability. It also makes the app immune to the trap
# where that variable, exported in a shell, makes a healthy launch look like a
# crash.
#
# onlyLoadAppFromAsar can break a packaged launch, so start the built app once
# after a change here. Midir HAS a native addon: da-pcap is asarUnpack'd below,
# because a .node file cannot load from inside an archive. The fuse governs where
# the app's code loads from, not the unpacked addon, and Electron's asar
# redirection still finds the addon in app.asar.unpacked. That was checked on a
# packaged --dir build with the fuses on: the window opened and capture loaded the
# addon. Check it again after any change to asarUnpack.
#
# Native electron-builder config, NOT an afterPack hook, as in the house template.
# resetAdHocDarwinSignature does nothing for a Windows-only build; it stays so the
# block is the house block and verify-fuses.test.mjs is the house test.
#
# scripts/verify-fuses.test.mjs asserts this block on every `npm test`;
# scripts/verify-fuses.mjs reads the wire off the packaged binary in the release
# build job (`npm run verify:fuses -- dist/win-unpacked/midir.exe`).
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
  # Electron checks app.asar against the hash electron-builder embeds in the
  # executable, file by file as it reads (HTOO-381; house decision, Sabrael,
  # 2026-09-28). electron-builder writes the hashes whatever the fuse says, so
  # this only makes Electron enforce them.
  #
  # A changed asar is then a DEAD app: exit code 1 and `ASAR Integrity Violation`
  # on stderr only, no window and no message. That is why it lands WITH the
  # reader, and why the release process starts the packaged build before tagging
  # (README, Releasing). The asarUnpack'd trees (resources/ and the da-pcap addon)
  # are outside the check. On Windows the hash lives in the inner midir.exe and
  # the release job signs the outer files, so this catches a damaged or changed
  # package, not a local attacker.
  # Cost (HTOO-399, measured in oghma): nothing warm, 10-25 ms on a launch from
  # new files, which is every portable start.
  enableEmbeddedAsarIntegrityValidation: true
  resetAdHocDarwinSignature: true
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # The scaffold excludes above miss every other dev tree in the repo root, so
  # they are packaged into app.asar unless they are named here. `resources/**`
  # must survive — it is asarUnpack'd and holds splash.html and the window icon.
  - '!{coverage,e2e,test-results,playwright-report,docs,scripts,.claude,.agents,.codex,.github}/*'
  - '!{CLAUDE.md,playwright.config.mjs,vitest.config.mjs}'
  - '!**/*.tsbuildinfo'
  - '!tsconfig*.json'
  # The addon's sources and build recipe are not needed at run time.
  - '!packages/da-pcap/src/**'
  - '!packages/da-pcap/binding.gyp'
  # node-gyp leaves about 11 MB of compiler intermediates beside the 205 KB
  # addon, and the addon is packaged twice. Only the .node file is loaded at
  # run time, so drop the rest.
  #
  # Every pattern here must stay negative. electron-builder replaces its
  # default include set as soon as one positive pattern appears, which drops
  # out/ and resources/ from the package.
  - '!**/da-pcap/build/Release/obj/**'
  - '!**/da-pcap/build/Release/*.{exp,iobj,ipdb,lib,pdb}'
  - '!**/da-pcap/build/*.{sln,gypi,vcxproj,filters}'
  - '!**/da-pcap/build/*.vcxproj.filters'
asarUnpack:
  - resources/**
  # A native module cannot be loaded from inside an asar archive.
  - node_modules/da-pcap/build/**
  - packages/da-pcap/build/**
win:
  executableName: midir
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${name}-${version}-portable.${ext}
  # NO `splashImage`, on purpose (HTOO-466). With one, the NSIS stub runs in GUI
  # mode: it paints the bitmap, hides its own "Setup" dialog, extracts, runs the
  # app, and — when the app exits — re-shows that hidden dialog for its completion
  # step before `AutoCloseWindow` closes it. That re-show is a blank window that
  # flashes after the app's own window has gone, on every close. There is no hook
  # to stop it: electron-builder reads `portable.nsi` verbatim for this target.
  #
  # Without it the stub runs `SetSilent silent` and owns no window. The cost is a
  # busy cursor, and no image, while the stub extracts the app to %TEMP% on each
  # launch. The in-app splash (`resources/splash.html`) covers everything from
  # electron's first frame on. Do not add the image back to fill that gap: it is
  # the flash's cause. `scripts/portable-config.test.mjs` pins the absence.
  #
  # Extract to a directory unique to each LAUNCH, not to each BUILD (HTOO-351,
  # fault 2). Left unset, electron-builder bakes one KSUID into the exe at build
  # time, so every copy of a build extracts to the same `$TEMP\<ksuid>`. Launch a
  # second copy and `portable.nsi` does `RMDir /r $INSTDIR` on the directory the
  # RUNNING app executes from, then copies into it, which fails on the locked exe
  # and DLLs; `extractAppPackage.nsh` retries five times and then shows NSIS's own
  # "Midir cannot be closed" Retry/Cancel box. The single-instance lock cannot stop
  # that: the stub runs before Electron starts. Removing the collision is the fix —
  # the second launch then reaches Electron, loses the lock, and exits while the
  # first window comes forward.
  #
  # TRUE, not the documented `false`. app-builder-lib 26.15.3 reads it as
  #   if (typeof unpackDirName === "string" || !unpackDirName)
  #     defines.UNPACK_DIR_NAME = unpackDirName || generateKsuid()
  # so `false` takes the `!false` branch and still gets a build-time KSUID: the
  # documented value does not give the documented behaviour. Only a truthy
  # non-string skips it, leaving `UNPACK_DIR_NAME` undefined so `portable.nsi`
  # falls back to `$PLUGINSDIR\app`, which NSIS makes unique per process. Do not
  # "correct" this to `false`; that silently restores the collision. Creidhne's
  # own config carries the artifact-byte measurement that proved it.
  #
  # The cost is that a launch killed at the stub leaves its whole folder behind,
  # app included, because no later launch reuses that name. `portableSweep.ts`
  # removes those on the next portable launch (HTOO-494).
  unpackDirName: true
# WINDOWS ONLY, on purpose. Midir captures the Dark Ages client's traffic and
# drives its window, and that client runs on Windows only. A macOS or Linux
# build has no game to read and no window to drive, so there is no mac, dmg,
# linux or appImage block, and release.yml builds Windows alone.
# `scripts/icons.test.mjs` pins the absence: the template's blocks come back
# with every port from it.
publish:
  provider: github
  owner: Caeldeth
  repo: midir
npmRebuild: false
beforeBuild: npx @electron/rebuild -f -w da-pcap
