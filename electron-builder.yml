appId: co.eris.midir
productName: Midir
# The Windows master, 1024x1024 with real alpha: the Red Hyb variant Midir
# claims (the document repo's docs/logos). The runtime assets are cut from it;
# see the recipes beside each use. build/ is buildResources and never packaged.
icon: build/icon.png
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # The scaffold excludes above miss every other dev tree in the repo root, so
  # they are packaged into app.asar unless they are named here. `resources/**`
  # must survive — it is asarUnpack'd and holds splash.html and the window icon.
  - '!{coverage,e2e,test-results,playwright-report,docs,scripts,.claude,.agents,.codex,.github}/*'
  - '!{CLAUDE.md,playwright.config.mjs,vitest.config.mjs}'
  - '!**/*.tsbuildinfo'
  - '!tsconfig*.json'
  # The addon's sources and build recipe are not needed at run time.
  - '!packages/da-pcap/src/**'
  - '!packages/da-pcap/binding.gyp'
  # node-gyp leaves about 11 MB of compiler intermediates beside the 205 KB
  # addon, and the addon is packaged twice. Only the .node file is loaded at
  # run time, so drop the rest.
  #
  # Every pattern here must stay negative. electron-builder replaces its
  # default include set as soon as one positive pattern appears, which drops
  # out/ and resources/ from the package.
  - '!**/da-pcap/build/Release/obj/**'
  - '!**/da-pcap/build/Release/*.{exp,iobj,ipdb,lib,pdb}'
  - '!**/da-pcap/build/*.{sln,gypi,vcxproj,filters}'
  - '!**/da-pcap/build/*.vcxproj.filters'
asarUnpack:
  - resources/**
  # A native module cannot be loaded from inside an asar archive.
  - node_modules/da-pcap/build/**
  - packages/da-pcap/build/**
win:
  executableName: midir
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  category: public.app-category.developer-tools
  # The square tile (docs/logos/macros/midir_fixed.png) inset to Apple's grid by
  # scripts/make-icons.mjs, never the Windows master, which is a round emblem.
  icon: build/icon-mac.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - universal
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # MUST be explicit, and must be a DIRECTORY (HTOO-38). electron-builder
  # resolves the Linux icon as [linux.icon, mac.icon ?? icon]: mac.icon outranks
  # the top-level icon, so leaving this unset ships the macOS artwork on Linux,
  # and a single PNG is never resampled, so a 1024 master becomes one hicolor
  # entry at a size no desktop indexes, a blank document icon. Regenerate with
  #   node scripts/make-icons.mjs
  icon: build/icons
  # Derives the installed .desktop filename from package.json's `desktopName`,
  # so it matches StartupWMClass and Electron's app_id (HTOO-63). Without it the
  # desktop environment cannot associate the running window with the .desktop
  # entry and shows a generic icon regardless of build/icons/.
  syncDesktopName: true
  target:
    - AppImage
    - deb
  maintainer: Caeldeth
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
publish:
  provider: github
  owner: Caeldeth
  repo: midir
npmRebuild: false
beforeBuild: npx @electron/rebuild -f -w da-pcap
