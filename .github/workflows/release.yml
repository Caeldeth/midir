name: Release

# Cribbed from taliesin (the most complete sibling variant). Requires these
# repository secrets before the first tagged release:
#   ES_USERNAME / ES_PASSWORD / ES_CREDENTIAL_ID / ES_TOTP_SECRET  (SSL.com eSigner, Windows)
#   DISCORD_WEBHOOK_URL                                            (release announcement)
#
# WINDOWS ONLY. The Dark Ages client runs on Windows only, so Midir has nothing
# to read or drive on macOS or Linux. The template's build-mac and build-linux
# jobs are removed; electron-builder.yml has no mac or linux block either.

# TAGS AND MANUAL ONLY (HTOO-390). This used to fire on `pull_request` AND on
# every push to `main`, and the second was the expensive one by a wide margin:
# the build jobs are guarded only by `github.event_name != 'pull_request'`, so a
# push to main ran build-windows, build-linux AND build-mac in full -- and then
# skipped `release`, because that one checks `ref_type == 'tag'`. Every merge
# built three platforms' artifacts and threw them away.
#
# GitHub bills macOS runners at 10x and windows at 2x. One day of house-wide CI
# on 2026-08-12 exhausted the shared Actions allowance and hit the account's
# spending limit mid-merge; this workflow was the largest single contributor.
#
# What replaces the lost per-PR check is a LOCAL gate, run by hand before a
# push: `npm run validate`, plus `npm run validate:linux` for real Linux
# through WSL.
#
# Everything below still runs on a `v*` tag and on workflow_dispatch, including
# validate, so a release is still gated.
#
# Fire it by hand when a change is platform-shaped:
#   gh workflow run release.yml --ref <branch>
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Fast validation gate — runs on every PR to main (and before any release
  # build). Keeps typecheck / lint / tests green so they can't silently rot
  # (these are not otherwise enforced anywhere).
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      - name: Test + coverage gate
        run: npm run test:coverage

  build-windows:
    runs-on: windows-latest
    needs: validate
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package portable exe
        run: npx electron-builder --win portable --publish never

      - name: Resolve artifact name + version
        id: pkg
        shell: bash
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Sign portable exe (SSL.com eSigner)
        uses: sslcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/dist/${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}-portable.exe
          override: true

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/*-portable.exe
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-windows]
    if: github.ref_type == 'tag'

    steps:
      # Checkout (the release job otherwise only downloads artifacts) so the
      # CHANGELOG + extract script are on disk.
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Pull this tag's section from CHANGELOG.md into the release body. Missing
      # section → empty file → the release falls back to the auto notes below.
      - name: Extract release notes from CHANGELOG
        run: node scripts/changelog-extract.mjs "${{ github.ref_name }}" > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*-portable.exe
          # Curated CHANGELOG section on top; generate_release_notes appends the
          # auto PR list + Full Changelog link below it.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Notify Discord
        if: success()
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG"
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\": \"**${REPO#*/} $TAG** is now available!\n$RELEASE_URL\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
